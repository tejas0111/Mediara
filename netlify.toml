# Netlify deploy config for DoseDaughter (Express app -> serverless function).
# The app is Express + a React SPA (app/web); Netlify runs it through serverless-http.
# NOTE: production MUST set MEMWAL_MODE=mainnet + keys, SESSION_SECRET, and
# OPENROUTER_API_KEY in the Netlify UI (Site settings -> Environment variables).
[build]
  base = "app"
  command = "npm --prefix web install --no-audit --no-fund && npm --prefix web run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["public/**", "src/**", "web/dist/**"]

# All dynamic routes go to the Express function; existing static files under
# app/public (e.g. /assets/app.js) are served directly by Netlify first.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
