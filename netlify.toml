# Netlify deploy config for Mediara (Express app -> serverless function).
# The app is Express + a React SPA (app/web); the api function serves
# everything (API + /app SPA + legacy pages) via serverless-http.
# NOTE: production MUST set MEMWAL_MODE=mainnet + keys, SESSION_SECRET,
# OPENROUTER_API_KEY, and the /tmp DD_* store paths in the Netlify UI
# (Site settings -> Environment variables). See DEPLOY-RUNBOOK.md.
[build]
  base = "app"
  command = "npm --prefix web install --no-audit --no-fund && npm --prefix web run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"
  # MEMWAL_MODE / MEMWAL_SERVER_URL hold non-secret config values ("mainnet",
  # public relayer URL) that also appear literally in code/docs — omit them
  # from Netlify's secrets scan (their VALUES would otherwise false-positive).
  # Real secrets (PRIVATE_KEY, SESSION_SECRET, OPENROUTER_API_KEY) stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "MEMWAL_MODE,MEMWAL_SERVER_URL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["src/**", "web/dist/**"]

# Static files under web/dist (the /app SPA bundle) are served directly by
# the CDN; without `force`, existing files win over this redirect, so only
# dynamic routes reach the Express function.
[[redirects]]
  from = "/demo.mp4"
  to = "/app/demo.mp4"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
