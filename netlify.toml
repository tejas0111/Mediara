# Netlify = static UI only. The Express API runs on Railway
# (mediara-production.up.railway.app); /api + server pages proxy there
# same-origin so wallet sessions/cookies keep working. No function routes —
# the v1 CJS loader cannot load the ESM-only memwal SDK.
[build]
  base = "app"
  command = "npm --prefix web install --no-audit --no-fund && npm --prefix web run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"
  # MEMWAL_MODE / MEMWAL_SERVER_URL hold non-secret config values ("mainnet",
  # public relayer URL) that also appear literally in code/docs — omit them
  # from Netlify's secrets scan (their VALUES would otherwise false-positive).
  # Real secrets (PRIVATE_KEY, SESSION_SECRET, OPENROUTER_API_KEY) stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "MEMWAL_MODE,MEMWAL_SERVER_URL"

[functions]
  directory = "netlify/functions"

# API + health + server-rendered pages → Railway (order matters: first match wins).
[[redirects]]
  from = "/api/*"
  to = "https://mediara-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/healthz"
  to = "https://mediara-production.up.railway.app/healthz"
  status = 200
  force = true

[[redirects]]
  from = "/demo"
  to = "https://mediara-production.up.railway.app/demo"
  status = 200
  force = true

[[redirects]]
  from = "/print"
  to = "https://mediara-production.up.railway.app/print"
  status = 200
  force = true

[[redirects]]
  from = "/memory"
  to = "https://mediara-production.up.railway.app/memory"
  status = 200
