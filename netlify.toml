[[redirects]]
  from = "/assets/*"
  to = "https://mediara-production.up.railway.app/assets/:splat"
  status = 200
  force = true

# Old SPA path (/app#/demo links in article/forms) → SPA now served at root.
# Browsers preserve the #fragment across the redirect.
[[redirects]]
  from = "/app"
  to = "/"
  status = 301

[[redirects]]
  from = "/app/*"
  to = "/"
  status = 301
